apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: econome
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "0"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/memory: "2Gi"
        run.googleapis.com/cpu: "2"
    spec:
      containerConcurrency: 100
      timeoutSeconds: 3600
      containers:
      - image: gcr.io/PROJECT_ID/econome:latest
        ports:
        - name: http1
          containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: GOOGLE_CLOUD_PROJECT
          value: "PROJECT_ID"
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: "/secrets/speech-credentials.json"
        resources:
          limits:
            cpu: "2"
            memory: "2Gi"
        volumeMounts:
        - name: speech-credentials
          mountPath: /secrets
          readOnly: true
        - name: gemini-credentials
          mountPath: /secrets
          readOnly: true
      volumes:
      - name: speech-credentials
        secret:
          secretName: speech-credentials
          items:
          - key: credentials.json
            path: speech-credentials.json
      - name: gemini-credentials
        secret:
          secretName: gemini-credentials
          items:
          - key: credentials.json
            path: gemini-credentials.json
  traffic:
  - percent: 100
    latestRevision: true
