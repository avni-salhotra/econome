steps:
  # Step 1: Build the Docker image with tags for build ID and latest
  - id: 'build-image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-f', 'devops/Dockerfile',
        '-t', 'gcr.io/$PROJECT_ID/econome:$BUILD_ID',
        '-t', 'gcr.io/$PROJECT_ID/econome:latest',
        '.'
      ]

  # Step 2: Push both tags to Container Registry
  - id: 'push-build-id'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/econome:$BUILD_ID']

  - id: 'push-latest'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/econome:latest']

  # Step 3: Deploy the image to Cloud Run with environment variables and secrets
  - id: 'deploy-cloud-run'
    name: 'gcr.io/cloud-builders/gcloud'
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'BUILD_ID=$BUILD_ID'
    args:
      [
        'run', 'deploy', 'econome',
        '--image=gcr.io/$PROJECT_ID/econome:$BUILD_ID',
        '--platform=managed',
        '--region=us-central1',
        '--allow-unauthenticated',
        '--memory=2Gi',
        '--cpu=2',
        '--concurrency=100',
        '--timeout=3600',
        '--max-instances=10',
        '--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,PORT=8080',
        '--set-secrets=/secrets/speech-credentials.json=speech-credentials:latest',
        '--set-secrets=/secrets/gemini-credentials.json=gemini-credentials:latest'
      ]

# Images to be stored in Container Registry after build
images:
  - 'gcr.io/$PROJECT_ID/econome:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/econome:latest'

# Build options for performance and logging
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Overall timeout for the build process
timeout: '1200s'
