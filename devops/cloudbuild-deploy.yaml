# Cloud Build configuration for deployment only using the smart deploy script
#
# This assumes the Docker image has already been built and pushed by cloudbuild-ci.yaml
#
# Usage Pattern:
# 1. First run CI build: gcloud builds submit --config devops/cloudbuild-ci.yaml .
# 2. Then run deployment: gcloud builds submit --config devops/cloudbuild-deploy.yaml .
#
# This separation allows for:
# - CI builds on every commit (cloudbuild-ci.yaml)
# - Manual deployment triggers (this file)
# - Full build+deploy (cloudbuild-prod.yaml)

steps:
  # Deploy specific image to Cloud Run with environment support
  - id: 'deploy-to-cloud-run'
    name: 'gcr.io/cloud-builders/gcloud'
    env:
      - 'PROJECT_ID=$PROJECT_ID'
      - 'BUILD_ID=$BUILD_ID'
      - 'ENVIRONMENT=${_ENVIRONMENT}'
      - 'IMAGE_TAG=${_IMAGE_TAG}'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=gcr.io/$PROJECT_ID/econome:${_IMAGE_TAG}'
      - '--platform=managed'
      - '--region=${_REGION}'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--concurrency=100'
      - '--timeout=3600'
      - '--max-instances=10'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,PORT=8080,ENVIRONMENT=${_ENVIRONMENT}'
      - '--set-secrets=/secrets/speech-credentials.json=speech-credentials:latest'
      - '--set-secrets=/secrets/gemini-credentials.json=gemini-credentials:latest'

# Substitution variables for flexibility
substitutions:
  _ENVIRONMENT: 'production'  # Default to production
  _IMAGE_TAG: 'latest'        # Default to latest image
  _SERVICE_NAME: 'econome'    # Service name (can be environment-specific)
  _REGION: 'us-central1'      # Default region

# Build options for performance and logging
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Overall timeout for the deployment process
timeout: '600s'
