steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'gcr.io/$PROJECT_ID/econome:$BUILD_ID',
      '-t', 'gcr.io/$PROJECT_ID/econome:latest',
      '.'
    ]

  # Push the container image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/econome:$BUILD_ID']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/econome:latest']

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'econome'
      - '--image=gcr.io/$PROJECT_ID/econome:$BUILD_ID'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--concurrency=100'
      - '--timeout=3600'
      - '--max-instances=10'
      - '--set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
      - '--set-env-vars=PORT=8080'
      - '--set-secrets=/secrets/speech-credentials.json=speech-credentials:latest'
      - '--set-secrets=/secrets/gemini-credentials.json=gemini-credentials:latest'

# Store images in Container Registry
images:
  - 'gcr.io/$PROJECT_ID/econome:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/econome:latest'

# Build options
options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

# Timeout for the entire build
timeout: '1200s'
