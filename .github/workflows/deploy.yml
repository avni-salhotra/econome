name: Deploy to Google Cloud Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: econome
  REGION: us-central1

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests in mock mode
      run: |
        python -m pytest test_*.py -v || echo "No pytest found, running manual tests"
        python main.py --test
      env:
        MOCK_MODE: true

    - name: Lint code
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker

    - name: Create secrets in Google Secret Manager
      run: |
        # Create speech credentials secret
        echo '${{ secrets.SPEECH_CREDENTIALS }}' | gcloud secrets create speech-credentials --data-file=- || \
        echo '${{ secrets.SPEECH_CREDENTIALS }}' | gcloud secrets versions add speech-credentials --data-file=-
        
        # Create gemini credentials secret  
        echo '${{ secrets.GEMINI_CREDENTIALS }}' | gcloud secrets create gemini-credentials --data-file=- || \
        echo '${{ secrets.GEMINI_CREDENTIALS }}' | gcloud secrets versions add gemini-credentials --data-file=-

    - name: Build and deploy to Cloud Run
      run: |
        gcloud builds submit --config cloudbuild.yaml .

    - name: Get service URL
      id: get-url
      run: |
        URL=$(gcloud run services describe $SERVICE_NAME --region=$REGION --format="value(status.url)")
        echo "SERVICE_URL=$URL" >> $GITHUB_OUTPUT
        echo "Service deployed at: $URL"

    - name: Test deployment
      run: |
        sleep 30  # Wait for service to be ready
        curl -f ${{ steps.get-url.outputs.SERVICE_URL }}/health || exit 1
        echo "✅ Deployment health check passed"

  security-scan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security scan
      uses: securecodewarrior/github-action-add-sarif@v1
      with:
        sarif-file: 'security-scan-results.sarif'
      continue-on-error: true

    - name: Check for secrets in code
      run: |
        # Check for potential secrets
        if grep -r "sk-" . --exclude-dir=.git --exclude-dir=.github; then
          echo "❌ Potential API keys found in code"
          exit 1
        fi
        
        if grep -r "AIza" . --exclude-dir=.git --exclude-dir=.github; then
          echo "❌ Potential Google API keys found in code"
          exit 1
        fi
        
        echo "✅ No obvious secrets found in code"

    - name: Verify .gitignore
      run: |
        # Check that credential files are in .gitignore
        if ! grep -q "speech-credentials.json" .gitignore; then
          echo "❌ speech-credentials.json not in .gitignore"
          exit 1
        fi
        
        if ! grep -q "gemini-credentials.json" .gitignore; then
          echo "❌ gemini-credentials.json not in .gitignore"
          exit 1
        fi
        
        if ! grep -q ".env" .gitignore; then
          echo "❌ .env not in .gitignore"
          exit 1
        fi
        
        echo "✅ Security files properly excluded"
