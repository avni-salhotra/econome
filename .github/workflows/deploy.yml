name: "CI + Deploy: Main Branch Push"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Global permissions for CI/CD
permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SERVICE_NAME: econome
      REGION: us-central1
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev python3-pyaudio

    - name: Install dependencies
      run: |
        python --version
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: Run unit tests and functional validation
      run: |
        python -m pytest tests/ -v || echo "No tests found, running manual tests"
        cd src && python main.py --test
      env:
        MOCK_MODE: true

    - name: Lint code
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # PR Build Validation: Build-only check for PRs (no push to registry)
  build-validation:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SERVICE_NAME: econome
      REGION: us-central1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image (validation only)
      uses: docker/build-push-action@v5
      with:
        context: .
        file: devops/Dockerfile
        push: false
        tags: |
          gcr.io/${{ secrets.GCP_PROJECT_ID }}/econome:pr-${{ github.event.number }}
          gcr.io/${{ secrets.GCP_PROJECT_ID }}/econome:pr-validation
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build validation summary
      run: |
        echo "✅ Docker build validation passed"
        echo "🔍 Image would be tagged as: gcr.io/${{ secrets.GCP_PROJECT_ID }}/econome:pr-${{ github.event.number }}"
        echo "📦 Build completed successfully - ready for merge"

  # CI-only job: Build and push image to registry (NO DEPLOYMENT)
  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      SERVICE_NAME: econome
      REGION: us-central1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Set up Google Cloud CLI
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker

    - name: Build and push image only (CI)
      run: |
        echo "🏗️ Running CI build - NO deployment"
        gcloud builds submit --config devops/cloudbuild-ci.yaml .
        echo "✅ Image built and pushed to registry"
        echo "🚀 Ready for manual deployment via GCP Console or deploy script"

  security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'

    # Explicit permissions for this job
    permissions:
      contents: read
      actions: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Fetch full history for better CodeQL analysis
        fetch-depth: 0

    - name: Check for secrets in code
      run: |
        # Check for potential secrets
        if grep -r "sk-" . --exclude-dir=.git --exclude-dir=.github; then
          echo "❌ Potential API keys found in code"
          exit 1
        fi

        if grep -r "AIza" . --exclude-dir=.git --exclude-dir=.github; then
          echo "❌ Potential Google API keys found in code"
          exit 1
        fi

        echo "✅ No obvious secrets found in code"

    - name: Verify .gitignore
      run: |
        # Check that credential files are in .gitignore
        if ! grep -q "speech-credentials.json" .gitignore; then
          echo "❌ speech-credentials.json not in .gitignore"
          exit 1
        fi

        if ! grep -q "gemini-credentials.json" .gitignore; then
          echo "❌ gemini-credentials.json not in .gitignore"
          exit 1
        fi

        if ! grep -q ".env" .gitignore; then
          echo "❌ .env not in .gitignore"
          exit 1
        fi

        echo "✅ Security files properly excluded"

    - name: Set up Python for security scanning
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install security scanning tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety semgrep
        pip install -r requirements.txt

    - name: Run Bandit security scan
      run: |
        echo "🔍 Running Bandit security analysis..."
        bandit -r src/ -f json -o bandit-report.json || true
        bandit -r src/ -f txt || echo "⚠️ Bandit found potential security issues"

    - name: Run Safety dependency scan
      run: |
        echo "🔍 Scanning dependencies for known vulnerabilities..."
        safety check --json --output safety-report.json || true
        safety check || echo "⚠️ Safety found vulnerable dependencies"

    - name: Run Semgrep security scan
      run: |
        echo "🔍 Running Semgrep security analysis..."
        semgrep --config=auto src/ --json --output=semgrep-report.json || true
        semgrep --config=auto src/ || echo "⚠️ Semgrep found potential security issues"

    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-scan-results
        path: |
          bandit-report.json
          safety-report.json
          semgrep-report.json
        retention-days: 30
