name: "02 - Build & Push"

on:
  push:
    branches: [ main ]
  workflow_run:
    workflows: ["01 - Test & Validate"]
    types: [completed]
    branches: [ main ]

# Security: Required permissions for build, push, and workflow triggering
permissions:
  contents: read
  actions: write  # Required to trigger staging deployment workflow
  packages: write  # Required for container registry operations

env:
  PROJECT_ID: econome-hackathon
  SERVICE_NAME: econome
  REGION: us-central1
  REGISTRY: gcr.io

jobs:
  # ===================================
  # BUILD AND PUSH TO REGISTRY
  # ===================================
  build-and-push:
    name: "🏗️ Build & Push Container"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run if tests passed (for workflow_run trigger) or on direct push to main
    if: |
      github.event_name == 'push' || 
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
      build-id: ${{ steps.meta.outputs.labels }}
    
    steps:
    - name: "📥 Checkout code"
      uses: actions/checkout@v4

    - name: "🔐 Authenticate to Google Cloud"
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}
        project_id: ${{ env.PROJECT_ID }}

    - name: "☁️ Set up Google Cloud CLI"
      uses: google-github-actions/setup-gcloud@v2

    - name: "🏷️ Generate image tags"
      id: tags
      run: |
        # Generate consistent tags for the image
        IMAGE_BASE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}"
        BUILD_TAG="build-${{ github.run_number }}"
        SHA_TAG="sha-${{ github.sha }}"

        # Always include build number tag (primary for deployments)
        TAGS="$IMAGE_BASE:$BUILD_TAG"

        # Add SHA tag for traceability
        TAGS="$TAGS,$IMAGE_BASE:$SHA_TAG"

        # Add latest tag for main branch
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          TAGS="$TAGS,$IMAGE_BASE:latest"
        fi

        # Add branch name for feature branches
        if [ "${{ github.ref }}" != "refs/heads/main" ]; then
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          TAGS="$TAGS,$IMAGE_BASE:$BRANCH_NAME"
        fi

        echo "🏷️ Generated tags: $TAGS"
        echo "tags=$TAGS" >> $GITHUB_OUTPUT
        echo "build-tag=$BUILD_TAG" >> $GITHUB_OUTPUT
        echo "image-base=$IMAGE_BASE" >> $GITHUB_OUTPUT

    - name: "🏷️ Generate image labels"
      id: labels
      run: |
        # Generate OCI-compliant labels
        LABELS="org.opencontainers.image.title=Econome"
        LABELS="$LABELS,org.opencontainers.image.description=Privacy-first conversation intelligence"
        LABELS="$LABELS,org.opencontainers.image.vendor=Econome Team"
        LABELS="$LABELS,org.opencontainers.image.version=${{ github.sha }}"
        LABELS="$LABELS,org.opencontainers.image.revision=${{ github.sha }}"
        LABELS="$LABELS,org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
        LABELS="$LABELS,org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}"
        LABELS="$LABELS,build.number=${{ github.run_number }}"
        LABELS="$LABELS,build.id=${{ github.run_id }}"
        LABELS="$LABELS,build.ref=${{ github.ref }}"
        LABELS="$LABELS,build.sha=${{ github.sha }}"

        echo "🏷️ Generated labels: $LABELS"
        echo "labels=$LABELS" >> $GITHUB_OUTPUT

    - name: "🏗️ Build and push with Cloud Build"
      id: build
      run: |
        echo "🏗️ Building and pushing image with gcloud builds submit..."
        echo "📋 Build configuration:"
        echo "  - Dockerfile: devops/Dockerfile"
        echo "  - Primary tag: ${{ steps.tags.outputs.build-tag }}"
        echo "  - All tags: ${{ steps.tags.outputs.tags }}"

        # Parse tags into individual tag arguments
        TAGS_ARG=""
        IFS=',' read -ra TAG_ARRAY <<< "${{ steps.tags.outputs.tags }}"
        for tag in "${TAG_ARRAY[@]}"; do
          TAGS_ARG="$TAGS_ARG --tag $tag"
        done

        echo "🏷️ Tag arguments: $TAGS_ARG"

        # Create temporary cloudbuild.yaml for custom Dockerfile location
        cat > cloudbuild-temp.yaml << EOF
        steps:
        - name: 'gcr.io/cloud-builders/docker'
          args: ['build', '-f', 'devops/Dockerfile', '-t', '\$_IMAGE_TAG', '.']
        images:
        - '\$_IMAGE_TAG'
        EOF

        # Build and push using Cloud Build with custom config
        BUILD_IDS=()
        for tag in "${TAG_ARRAY[@]}"; do
          echo "🏗️ Building and pushing: $tag"

          # Submit build asynchronously to avoid log streaming issues
          echo "🚀 Submitting build for: $tag"
          BUILD_OUTPUT=$(gcloud builds submit \
            --config=cloudbuild-temp.yaml \
            --substitutions="_IMAGE_TAG=$tag" \
            --machine-type=e2-highcpu-8 \
            --disk-size=100GB \
            --timeout=1200s \
            --async \
            . 2>&1)

          if [[ $? -eq 0 ]]; then
            # Debug: Show the raw output
            echo "🔍 Raw build output:"
            echo "$BUILD_OUTPUT"
            echo "---"

            # Extract build ID from the Cloud Build URL in the output
            BUILD_ID=$(echo "$BUILD_OUTPUT" | grep -o 'builds/[a-f0-9-]\+' | sed 's/builds\///' | head -1)

            echo "🔍 Extracted build ID: '$BUILD_ID'"

            if [[ -n "$BUILD_ID" && "$BUILD_ID" =~ ^[a-f0-9-]+$ ]]; then
              BUILD_IDS+=("$BUILD_ID")
              echo "✅ Build submitted successfully: $BUILD_ID"
              echo "🔗 Build URL: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=${{ env.PROJECT_ID }}"
            else
              echo "❌ Could not extract valid build ID from output"
              echo "Expected format: [a-f0-9-]+"
              echo "Got: '$BUILD_ID'"
              exit 1
            fi
          else
            echo "❌ Build submission failed for $tag"
            echo "Error output: $BUILD_OUTPUT"
            exit 1
          fi
        done

        # Check if we have any builds to monitor
        if [ ${#BUILD_IDS[@]} -eq 0 ]; then
          echo "❌ No builds were submitted successfully"
          exit 1
        fi

        # Wait for all builds to complete
        echo "⏳ Waiting for ${#BUILD_IDS[@]} builds to complete..."
        for BUILD_ID in "${BUILD_IDS[@]}"; do
          echo "🔍 Checking build status: $BUILD_ID"

          # Wait for build completion with timeout
          TIMEOUT=600  # 🚀 OPTIMIZED: 10 minutes (was 20 minutes)
          ELAPSED=0
          INTERVAL=15  # 🚀 OPTIMIZED: 15s polling (was 30s)

          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(gcloud builds describe "$BUILD_ID" --format="value(status)" 2>/dev/null || echo "UNKNOWN")

            case "$STATUS" in
              "SUCCESS")
                echo "✅ Build completed successfully: $BUILD_ID"
                break
                ;;
              "FAILURE"|"TIMEOUT"|"CANCELLED")
                echo "❌ Build failed with status: $STATUS"
                echo "🔗 Check logs: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=${{ env.PROJECT_ID }}"
                exit 1
                ;;
              "WORKING"|"QUEUED")
                echo "⏳ Build in progress ($STATUS)... elapsed: ${ELAPSED}s"
                sleep $INTERVAL
                ELAPSED=$((ELAPSED + INTERVAL))
                ;;
              *)
                echo "⚠️ Unknown build status: $STATUS"
                sleep $INTERVAL
                ELAPSED=$((ELAPSED + INTERVAL))
                ;;
            esac
          done

          if [ $ELAPSED -ge $TIMEOUT ]; then
            echo "❌ Build timed out after ${TIMEOUT}s: $BUILD_ID"
            exit 1
          fi
        done

        # Clean up temporary config
        rm cloudbuild-temp.yaml

        echo "✅ All Cloud Build jobs completed successfully"

        # Get the image digest for the primary build tag
        echo "📋 Getting image digest for primary tag..."
        IMAGE_DIGEST=$(gcloud container images describe ${{ steps.tags.outputs.image-base }}:${{ steps.tags.outputs.build-tag }} --format="value(image_summary.digest)" 2>/dev/null || echo "")

        if [[ -n "$IMAGE_DIGEST" ]]; then
          echo "📋 Image digest: $IMAGE_DIGEST"
          echo "digest=$IMAGE_DIGEST" >> $GITHUB_OUTPUT
        else
          echo "⚠️ Could not retrieve image digest, but build completed successfully"
          echo "digest=" >> $GITHUB_OUTPUT
        fi

    - name: "📋 Generate build summary"
      run: |
        echo "# 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📦 Container Image" >> $GITHUB_STEP_SUMMARY
        echo "- **Registry**: ${{ steps.tags.outputs.image-base }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Primary Tag**: \`${{ steps.tags.outputs.build-tag }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **All Tags**: " >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.tags.outputs.tags }}" | tr ',' '\n' | sed 's/^/  - /' >> $GITHUB_STEP_SUMMARY
        echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 🚀 Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "- ✅ Image pushed to Container Registry" >> $GITHUB_STEP_SUMMARY
        echo "- 🔄 Staging deployment will start automatically" >> $GITHUB_STEP_SUMMARY
        echo "- 📊 Monitor staging deployment in next workflow" >> $GITHUB_STEP_SUMMARY

    - name: "🔍 Verify build tag was created"
      run: |
        echo "🔍 Verifying build-${{ github.run_number }} tag was created..."

        # Wait a moment for registry propagation
        echo "⏱️ Waiting 3 seconds for registry propagation..."
        sleep 3  # 🚀 OPTIMIZED: 3s (was 10s)

        # Retry logic for tag verification
        MAX_RETRIES=3  # 🚀 OPTIMIZED: 3 retries (was 5)
        RETRY_DELAY=5  # 🚀 OPTIMIZED: 5s delay (was 10s)
        RETRY_COUNT=0
        TAG_FOUND=false

        while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
          echo "🔍 Attempt $((RETRY_COUNT + 1))/$MAX_RETRIES: Checking for build-${{ github.run_number }} tag..."

          if gcloud container images list-tags ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }} \
            --filter="tags:build-${{ github.run_number }}" --format="value(tags)" | grep -q "build-${{ github.run_number }}"; then
            echo "✅ build-${{ github.run_number }} tag exists"
            TAG_FOUND=true
            break
          else
            echo "⏳ build-${{ github.run_number }} tag not found yet..."

            if [ $RETRY_COUNT -lt $((MAX_RETRIES - 1)) ]; then
              echo "⏱️ Waiting ${RETRY_DELAY} seconds before retry..."
              sleep $RETRY_DELAY
            fi
          fi

          RETRY_COUNT=$((RETRY_COUNT + 1))
        done

        if [ "$TAG_FOUND" = false ]; then
          echo "❌ build-${{ github.run_number }} tag not found after $MAX_RETRIES attempts!"
          echo "🔍 Available tags:"
          gcloud container images list-tags ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }} \
            --limit=10 --sort-by=~TIMESTAMP --format="table(digest,tags,timestamp)"

          echo "🔍 Checking if image was pushed without tags..."
          gcloud container images list-tags ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }} \
            --limit=5 --sort-by=~TIMESTAMP --format="table(digest,tags,timestamp)"

          exit 1
        fi

    - name: "🔍 Verify image in registry"
      run: |
        echo "🔍 Verifying image was pushed successfully..."
        gcloud container images list-tags ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }} \
          --limit=5 --sort-by=~TIMESTAMP --format="table(digest,tags,timestamp)"

  # ===================================
  # TRIGGER STAGING DEPLOYMENT
  # ===================================
  trigger-staging:
    name: "🎯 Trigger Staging Deployment"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()

    steps:
    - name: "📥 Checkout code"
      uses: actions/checkout@v4

    - name: "🔐 Authenticate to Google Cloud"
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}
        project_id: ${{ env.PROJECT_ID }}

    - name: "☁️ Set up Google Cloud CLI"
      uses: google-github-actions/setup-gcloud@v2

    - name: "🚀 Trigger staging deployment"
      run: |
        echo "🚀 Triggering staging deployment..."
        echo "📋 Deployment parameters:"
        echo "  - Image tag: ${{ github.run_number }}"
        echo "  - Build ID: ${{ github.run_id }}"
        echo "  - Repository: ${{ github.repository }}"

        # Brief wait to ensure build job completion is fully processed
        echo "⏱️ Waiting 2 seconds to ensure build completion is processed..."
        sleep 2  # 🚀 OPTIMIZED: 2s (was 10s)

        # Trigger the staging deployment workflow
        # Note: Image verification will be handled by the staging deployment workflow
        gh workflow run "03-deploy-staging.yml" \
          --field image-tag="${{ github.run_number }}" \
          --field build-id="${{ github.run_id }}" \
          --repo "${{ github.repository }}"

        echo "✅ Staging deployment workflow triggered successfully"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: "🔍 Verify workflow trigger"
      run: |
        echo "🔍 Verifying staging deployment workflow was triggered..."
        # 🚀 OPTIMIZED: Removed 5s wait - GitHub registers workflows immediately

        # Check recent workflow runs
        RECENT_RUNS=$(gh run list --workflow="03-deploy-staging.yml" --limit=1 --json status,createdAt,conclusion)
        echo "📊 Recent staging workflow runs:"
        echo "$RECENT_RUNS"

    - name: "📢 Notify staging deployment"
      run: |
        echo "# 🎯 Staging Deployment Triggered" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 📋 Deployment Details" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: Staging" >> $GITHUB_STEP_SUMMARY
        echo "- **Image Tag**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Triggered At**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## 🔗 Links" >> $GITHUB_STEP_SUMMARY
        echo "- [View Staging Deployment Workflow](https://github.com/${{ github.repository }}/actions)" >> $GITHUB_STEP_SUMMARY
        echo "- [Staging Service URL](https://econome-staging-${{ env.PROJECT_ID }}.a.run.app)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "## ⏭️ Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. 🔍 Monitor the staging deployment workflow" >> $GITHUB_STEP_SUMMARY
        echo "2. 🧪 Review staging test results" >> $GITHUB_STEP_SUMMARY
        echo "3. 🚀 Trigger production deployment when ready" >> $GITHUB_STEP_SUMMARY

  # ===================================
  # CLEANUP OLD IMAGES
  # ===================================
  cleanup-registry:
    name: "🧹 Cleanup Old Images"
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()
    
    steps:
    - name: "🔐 Authenticate to Google Cloud"
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ secrets.GCP_CREDENTIALS }}
        project_id: ${{ env.PROJECT_ID }}

    - name: "☁️ Set up Google Cloud CLI"
      uses: google-github-actions/setup-gcloud@v2

    - name: "🧹 Clean up old images (keep last 10)"
      run: |
        echo "🧹 Cleaning up old container images..."
        
        # Get list of images older than the last 10
        OLD_IMAGES=$(gcloud container images list-tags ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }} \
          --limit=999 --sort-by=~TIMESTAMP --format="get(digest)" | tail -n +11)
        
        if [ -n "$OLD_IMAGES" ]; then
          echo "🗑️ Deleting old images..."
          for digest in $OLD_IMAGES; do
            echo "Deleting: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}@$digest"
            gcloud container images delete "${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }}@$digest" \
              --quiet --force-delete-tags || echo "⚠️ Failed to delete $digest"
          done
          echo "✅ Cleanup completed"
        else
          echo "✅ No old images to clean up"
        fi

    - name: "📊 Registry status"
      run: |
        echo "📊 Current images in registry:"
        gcloud container images list-tags ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE_NAME }} \
          --limit=10 --sort-by=~TIMESTAMP --format="table(digest,tags,timestamp)"
